apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-micrometer-app
  namespace: default
  labels:
    app: quarkus-micrometer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-micrometer-app
  template:
    metadata:
      labels:
        app: quarkus-micrometer-app
    spec:
      containers:
        - name: quarkus-micrometer-app
          image: localhost/quarkus-micrometer-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-micrometer-app
  namespace: default
  labels:
    app: quarkus-micrometer-app
spec:
  selector:
    app: quarkus-micrometer-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
