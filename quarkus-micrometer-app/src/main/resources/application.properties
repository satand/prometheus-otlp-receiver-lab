quarkus.application.name=quarkus-micrometer-app

# OTel exporter protocol
quarkus.otel.exporter.otlp.protocol=http/protobuf

# Base OTLP endpoint (SDK appends /v1/metrics for http/protobuf)
quarkus.otel.exporter.otlp.endpoint=http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp

# Metrics export interval
quarkus.otel.metric.export.interval=10s

# Disable traces and logs
quarkus.otel.traces.exporter=none
quarkus.otel.logs.exporter=none

# Service resource attributes
quarkus.otel.resource.attributes=service.name=quarkus-micrometer-app
